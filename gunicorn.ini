# Gunicorn configuration settings.
import multiprocessing

# Don't start too many workers:
workers = min(multiprocessing.cpu_count() * 2 + 1, 16)
# Give workers an expiry:
max_requests = 2048
max_requests_jitter = 256
preload_app = True
timeout = 7200  # 2 hours — large GIS file transfers via streaming download can exceed 10 min
# Disable access logging.
#accesslog = None
accesslog = "/app/logs/gunicorn.log"
access_log_format = '%(h)s %(l)s %(u)s %(t)s "%(r)s" %(s)s %(b)s "%(f)s" "%(a)s" %(T)s %(M)s %(D)s %(L)s'


def when_ready(server):
    # preload_app makes the master load Django, which opens the log files.
    # The master never logs, so WatchedFileHandler never reopens them and the
    # master keeps the rotated file open (on the SMB log mount it cannot be
    # removed, and log_rotate.sh can no longer rotate the log).
    # Close them here; workers open the file again on their first record.
    import logging
    for name in ('file', 'file_for_sql'):
        handler = logging.getHandlerByName(name)
        if handler:
            handler.close()
